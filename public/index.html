<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 AI 塔罗牌占卜 - 洞察你的命运</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="starfield"></div>
    
    <div class="container">
        <!-- 标题 -->
        <header class="header">
            <h1>✨ AI 塔罗占卜馆 ✨</h1>
            <p class="subtitle">与命运对话，寻找内心的光芒</p>
        </header>

        <!-- 问题输入区 -->
        <section class="input-section">
            <div class="question-group">
                <label for="question">💫 请提出你的问题</label>
                <input 
                    type="text" 
                    id="question" 
                    placeholder="例如：我最近的事业运如何？"
                    maxlength="100"
                >
                <div class="char-count"><span id="charCount">0</span>/100</div>
            </div>

            <button id="divineBtn" class="divine-btn">
                <span>开始占卜</span>
                <span class="btn-glow"></span>
            </button>
        </section>

        <!-- 塔罗牌显示区 -->
        <section class="cards-section">
            <h2>🃏 命运之牌</h2>
            <div class="cards-container">
                <div class="card-slot">
                    <div class="card" id="card1">
                        <div class="card-inner">
                            <div class="card-front">✦</div>
                            <div class="card-back">
                                <div class="card-pattern">✦</div>
                                <div class="card-pattern">✦</div>
                                <div class="card-pattern">✦</div>
                            </div>
                        </div>
                    </div>
                    <p class="card-name" id="name1"></p>
                </div>

                <div class="card-slot">
                    <div class="card" id="card2">
                        <div class="card-inner">
                            <div class="card-front">✦</div>
                            <div class="card-back">
                                <div class="card-pattern">✦</div>
                                <div class="card-pattern">✦</div>
                                <div class="card-pattern">✦</div>
                            </div>
                        </div>
                    </div>
                    <p class="card-name" id="name2"></p>
                </div>

                <div class="card-slot">
                    <div class="card" id="card3">
                        <div class="card-inner">
                            <div class="card-front">✦</div>
                            <div class="card-back">
                                <div class="card-pattern">✦</div>
                                <div class="card-pattern">✦</div>
                                <div class="card-pattern">✦</div>
                            </div>
                        </div>
                    </div>
                    <p class="card-name" id="name3"></p>
                </div>
            </div>
        </section>

        <!-- 占卜结果区 -->
        <section class="result-section" id="resultSection" style="display: none;">
            <h2>📜 占卜解读</h2>
            <div class="result-box">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>天机正在推算...</p>
                </div>
                <div class="divination-text" id="divinationText"></div>
            </div>
            <button class="restart-btn" id="restartBtn">🔄 重新占卜</button>
        </section>

        <!-- 错误提示 -->
        <div class="error-modal" id="errorModal">
            <div class="error-content">
                <p id="errorText"></p>
                <button class="error-close-btn" id="errorCloseBtn">关闭</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
